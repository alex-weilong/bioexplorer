<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioExplorer</title>
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
:root{--bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;--accent:#7ee787;--accent2:#58a6ff;--accent3:#f78166;--text:#e6edf3;--muted:#8b949e;--dim:#484f58}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(126,231,135,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(126,231,135,.025) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0}
header{position:sticky;top:0;z-index:100;background:rgba(13,17,23,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 40px}
.header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:20px;height:62px}
.logo{font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:700;white-space:nowrap;flex-shrink:0;cursor:pointer}
.logo em{color:var(--accent);font-style:italic}
.breadcrumb{display:flex;align-items:center;gap:4px;font-family:'DM Mono',monospace;font-size:.78rem;flex:1;min-width:0;overflow:hidden}
.crumb{color:var(--muted);cursor:pointer;padding:3px 7px;border-radius:4px;white-space:nowrap;transition:all .15s}
.crumb:hover{color:var(--text);background:var(--surface2)}
.crumb.current{color:var(--text);cursor:default;overflow:hidden;text-overflow:ellipsis}
.crumb-sep{color:var(--dim);flex-shrink:0}
.src-badge{flex-shrink:0;margin-left:auto;display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:.68rem;font-family:'DM Mono',monospace;border:1px solid rgba(126,231,135,.35);color:var(--accent);background:rgba(126,231,135,.04)}
main{max-width:1400px;margin:0 auto;padding:40px 40px 80px;position:relative;z-index:1}
.level-header{margin-bottom:32px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.level-rank{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);border:1px solid var(--dim);padding:3px 8px;border-radius:4px;display:inline-block;margin-bottom:6px}
.level-title{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,3vw,2.7rem);font-weight:700;line-height:1;font-style:italic}
.level-sub{color:var(--muted);font-size:.83rem;margin-left:auto;font-family:'DM Mono',monospace;white-space:nowrap}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;animation:fadeUp .3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.taxon-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;display:flex;flex-direction:column}
.taxon-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,0,0,.4)}
.tc-img-wrap{width:100%;aspect-ratio:3/2;overflow:hidden;background:var(--surface2);flex-shrink:0;position:relative}
.tc-img{width:100%;height:100%;object-fit:cover;transition:transform .4s;display:block}
.taxon-card:hover .tc-img{transform:scale(1.06)}
.tc-no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:2rem}
.tc-body{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column;gap:4px}
.tc-arrow{position:absolute;top:10px;right:10px;color:white;font-size:.9rem;background:rgba(0,0,0,.45);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s;backdrop-filter:blur(4px);z-index:1}
.taxon-card:hover .tc-arrow{background:var(--accent);color:#0d1117;transform:translateX(2px)}
.tc-rank{font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.tc-name{font-family:'Playfair Display',serif;font-style:italic;font-size:1.05rem;line-height:1.2;color:var(--text)}
.tc-common{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tc-pill{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted);background:var(--surface2);padding:2px 7px;border-radius:99px}
.kingdom-grid{display:flex;gap:12px;animation:fadeUp .3s ease both;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.kingdom-grid::-webkit-scrollbar{display:none}
.kingdom-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;cursor:pointer;transition:all .22s;overflow:hidden;position:relative;display:flex;flex-direction:row;align-items:center;flex:1;min-width:160px;gap:0}
.kingdom-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 10px 32px rgba(0,0,0,.45)}
.kingdom-icon-wrap{flex-shrink:0;width:72px;height:72px;display:flex;align-items:center;justify-content:center;font-size:2.2rem;background:var(--surface2);border-right:1px solid var(--border);transition:background .22s}
.kingdom-card:hover .kingdom-icon-wrap{background:rgba(126,231,135,.06)}
.kingdom-img-wrap{flex-shrink:0;width:72px;height:72px;overflow:hidden;background:var(--surface2);border-right:1px solid var(--border)}
.kingdom-img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.kingdom-card:hover .kingdom-img{transform:scale(1.1)}
.kingdom-body{padding:12px 16px;display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.kingdom-badge{font-family:'DM Mono',monospace;font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.kingdom-name{font-family:'Playfair Display',serif;font-style:italic;font-size:1.05rem;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kingdom-common{font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kingdom-hint{font-size:.6rem;color:var(--dim);font-family:'DM Mono',monospace;margin-top:2px}
.kingdom-arrow{flex-shrink:0;margin-right:12px;background:var(--surface2);color:var(--dim);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:.8rem;transition:all .22s;border:1px solid var(--border)}
.kingdom-card:hover .kingdom-arrow{background:var(--accent);color:#0d1117;border-color:var(--accent)}
.loading{text-align:center;padding:100px 20px}
.spinner{width:42px;height:42px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-msg{color:var(--muted);font-family:'DM Mono',monospace;font-size:.82rem}
.loading-sub{color:var(--dim);font-size:.7rem;margin-top:8px}
.filter-bar{background:rgba(13,17,23,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 40px;position:sticky;top:62px;z-index:99}
.filter-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:10px;height:52px}
.filter-divider{width:1px;height:22px;background:var(--border);flex-shrink:0;margin:0 2px}
.filter-label{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap;flex-shrink:0}
.place-wrap{position:relative;flex:1;max-width:320px}
.place-input{width:100%;padding:6px 28px 6px 30px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.82rem;outline:none;transition:border-color .2s}
.place-input:focus{border-color:var(--accent2)}
.place-input::placeholder{color:var(--dim)}
.place-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:.85rem;pointer-events:none}
.place-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--dim);cursor:pointer;font-size:.9rem;display:none;padding:2px;line-height:1;transition:color .15s}
.place-clear.visible{display:block}
.place-clear:hover{color:var(--text)}
.place-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,.5);overflow:hidden;display:none}
.place-dropdown.open{display:block}
.place-result{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;transition:background .12s;border-bottom:1px solid var(--border);font-size:.82rem}
.place-result:last-child{border-bottom:none}
.place-result:hover,.place-result.focused{background:var(--surface2)}
.pr-icon{font-size:1rem;flex-shrink:0}
.pr-name{flex:1;color:var(--text)}
.pr-type{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--dim);text-transform:uppercase}
.place-msg{padding:10px 12px;color:var(--dim);font-family:'DM Mono',monospace;font-size:.72rem;text-align:center}
.place-preview{border-top:1px solid var(--border);height:180px;position:relative;background:var(--surface2);display:none}
.place-preview.visible{display:block}
.place-preview-label{position:absolute;bottom:8px;left:8px;z-index:10;font-family:'DM Mono',monospace;font-size:.62rem;color:white;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:4px;backdrop-filter:blur(4px);max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#placePreviewMap{width:100%;height:100%}
.active-place{display:none;align-items:center;gap:8px;padding:4px 10px;border-radius:99px;background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.35);font-size:.75rem;font-family:'DM Mono',monospace;color:var(--accent2)}
.active-place.visible{display:flex}
.active-place button{background:none;border:none;color:var(--accent2);cursor:pointer;font-size:.85rem;padding:0;line-height:1;opacity:.7;transition:opacity .15s}
.active-place button:hover{opacity:1}
.search-wrap{position:relative;flex:1;max-width:320px}
.search-input{width:100%;padding:6px 28px 6px 30px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.82rem;outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--accent2)}
.search-input::placeholder{color:var(--dim)}
.search-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:.85rem;pointer-events:none}
.search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);color:var(--dim);background:none;border:none;cursor:pointer;font-size:.9rem;display:none;padding:2px;line-height:1;border-radius:4px;transition:color .15s}
.search-clear:hover{color:var(--text)}
.search-clear.visible{display:block}
.search-dropdown{position:absolute;top:calc(100% + 6px);left:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,.5);overflow:hidden;display:none;min-width:320px}
.search-dropdown.open{display:block}
.search-result{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--border)}
.search-result:last-child{border-bottom:none}
.search-result:hover,.search-result.focused{background:var(--surface2)}
.sr-photo{width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--surface2)}
.sr-no-photo{width:40px;height:40px;border-radius:6px;background:var(--surface2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.sr-info{flex:1;min-width:0}
.sr-name{font-family:'Playfair Display',serif;font-style:italic;font-size:.88rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-common{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-rank{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;flex-shrink:0}
.search-msg{padding:12px 14px;color:var(--dim);font-family:'DM Mono',monospace;font-size:.75rem;text-align:center}
.map-popover{position:fixed;z-index:900;width:300px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.7);overflow:hidden;pointer-events:none;opacity:0;transform:scale(.94) translateY(6px);transition:opacity .18s ease,transform .18s ease}
.map-popover.visible{opacity:1;transform:scale(1) translateY(0);pointer-events:all}
.map-popover-header{padding:8px 12px 6px;font-family:'Playfair Display',serif;font-style:italic;font-size:.82rem;color:var(--text);border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-popover-map{width:300px;height:200px;display:block}
.map-popover-footer{padding:5px 10px;font-family:'DM Mono',monospace;font-size:.6rem;color:var(--dim);text-align:right}
.map-popover-loading{width:300px;height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--dim);font-family:'DM Mono',monospace;font-size:.7rem;background:var(--surface2)}
.map-spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent2);border-radius:50%;animation:spin .75s linear infinite}
.phenology-popover{position:fixed;z-index:900;width:320px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.7);overflow:hidden;pointer-events:none;opacity:0;transform:scale(.94) translateY(6px);transition:opacity .18s ease,transform .18s ease}
.phenology-popover.visible{opacity:1;transform:scale(1) translateY(0);pointer-events:all}
.phenology-header{padding:8px 12px 6px;font-family:'Playfair Display',serif;font-style:italic;font-size:.82rem;color:var(--text);border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phenology-body{padding:14px 14px 10px}
.phenology-chart{display:flex;align-items:flex-end;gap:3px;height:70px}
.phenology-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.phenology-month{font-family:'DM Mono',monospace;font-size:.52rem;color:var(--dim);text-align:center;line-height:1}
.phenology-footer{padding:6px 14px 10px;font-family:'DM Mono',monospace;font-size:.6rem;color:var(--dim);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phenology-legend{display:flex;align-items:center;gap:4px}
.phenology-dot{width:8px;height:8px;border-radius:2px}
.phenology-loading{padding:28px 14px;text-align:center;font-family:'DM Mono',monospace;font-size:.72rem;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:8px}
.modal-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.82);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:760px;max-height:90vh;overflow-y:auto;transform:scale(.96);transition:transform .2s;position:relative}
.modal-overlay.open .modal{transform:scale(1)}
.modal-handle{display:none;width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0}
.gallery-wrap{position:relative;background:#000;border-radius:16px 16px 0 0;overflow:hidden}
.gallery-main{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;cursor:zoom-in}
.gallery-counter{position:absolute;top:12px;left:12px;z-index:2;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;font-family:'DM Mono',monospace;font-size:.68rem;padding:3px 10px;backdrop-filter:blur(4px)}
.gallery-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;backdrop-filter:blur(4px);transition:all .2s;z-index:2}
.gallery-nav:hover{background:rgba(126,231,135,.3);border-color:var(--accent)}
.gallery-nav.prev{left:10px}
.gallery-nav.next{right:10px}
.gallery-nav:disabled{opacity:.2;cursor:default;pointer-events:none}
.gallery-thumbs{display:flex;gap:6px;padding:8px 12px;background:rgba(0,0,0,.7);overflow-x:auto;position:absolute;bottom:0;left:0;right:0;scrollbar-width:none}
.gallery-thumbs::-webkit-scrollbar{display:none}
.gallery-thumb{width:52px;height:40px;object-fit:cover;border-radius:5px;cursor:pointer;flex-shrink:0;border:2px solid transparent;transition:all .15s;opacity:.6}
.gallery-thumb.active{border-color:var(--accent);opacity:1}
.gallery-thumb:hover{opacity:.9}
.gallery-caption{position:absolute;bottom:56px;left:0;right:0;padding:4px 12px;font-family:'DM Mono',monospace;font-size:.62rem;color:rgba(255,255,255,.6);text-align:right;pointer-events:none}
.gallery-loading-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--surface2);border-radius:16px 16px 0 0}
.modal-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.65);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .2s;z-index:2}
.modal-close:hover{border-color:var(--accent3);background:rgba(247,129,102,.15)}
.modal-body{padding:28px}
.modal-sci{font-family:'Playfair Display',serif;font-style:italic;font-size:1.8rem;margin-bottom:6px}
.modal-common{color:var(--muted);font-size:.92rem;margin-bottom:20px}
.modal-stats{display:flex;gap:24px;background:var(--surface2);border-radius:10px;padding:16px;margin-bottom:20px}
.ms-val{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--accent)}
.ms-key{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.modal-links{display:flex;gap:10px;flex-wrap:wrap}
.modal-link{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;border:1px solid var(--accent2);color:var(--accent2);text-decoration:none;font-size:.78rem;font-family:'DM Mono',monospace;transition:all .2s}
.modal-link:hover{background:rgba(88,166,255,.1)}
.map-section{margin-top:24px}
.map-label{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
#speciesMap{width:100%;height:280px;border-radius:10px;border:1px solid var(--border);overflow:hidden;background:var(--surface2)}
.map-loading{width:100%;height:280px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--dim);font-family:'DM Mono',monospace;font-size:.75rem}
.map-note{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--dim);margin-top:6px;text-align:right}
.leaflet-popup-content-wrapper{background:#fff!important;border:1px solid #ddd!important;border-radius:8px!important;color:#333!important;box-shadow:0 4px 16px rgba(0,0,0,.15)!important;font-size:.75rem}
.leaflet-popup-tip{background:#fff!important}
.leaflet-popup-content{margin:8px 12px!important;font-family:'DM Sans',sans-serif}
.leaflet-container{background:#f5f5f0!important}
.error-box{text-align:center;padding:80px 20px}
.error-box h3{font-family:'Playfair Display',serif;font-style:italic;color:var(--accent3);font-size:1.4rem;margin-bottom:8px}
.error-box p{color:var(--muted);font-size:.82rem;font-family:'DM Mono',monospace;max-width:480px;margin:0 auto}
.retry-btn{margin-top:20px;padding:8px 20px;border:1px solid var(--accent);color:var(--accent);background:none;border-radius:6px;cursor:pointer;font-family:'DM Mono',monospace;font-size:.8rem;transition:all .2s}
.retry-btn:hover{background:rgba(126,231,135,.08)}
.auth-btn{display:flex;align-items:center;gap:7px;padding:5px 12px 5px 5px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);color:var(--text);cursor:pointer;flex-shrink:0;font-family:'DM Mono',monospace;font-size:.72rem;transition:all .2s;white-space:nowrap}
.auth-btn:hover{border-color:var(--accent2);color:var(--accent2)}
.auth-avatar{width:24px;height:24px;border-radius:50%;background-size:cover;background-position:center;border:1px solid var(--border);display:none;flex-shrink:0}
.seen-badge{position:absolute;top:6px;right:6px;z-index:2;background:var(--accent);color:#0d1117;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.4);pointer-events:none}
.my-species-btn{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:rgba(126,231,135,.08);border:1px solid rgba(126,231,135,.3);color:var(--accent);cursor:pointer;font-family:'DM Mono',monospace;font-size:.72rem;transition:all .2s;flex-shrink:0;white-space:nowrap}
.my-species-btn:hover{background:rgba(126,231,135,.15);border-color:var(--accent)}
.my-species-count{font-size:.85rem;font-weight:700}
.lightbox{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;cursor:zoom-out;opacity:0;pointer-events:none;transition:opacity .2s}
.lightbox.open{opacity:1;pointer-events:all}
.lightbox img{max-width:95vw;max-height:95vh;object-fit:contain;border-radius:4px}
.all-species-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:1px solid var(--accent);color:var(--accent);background:rgba(126,231,135,.06);font-family:'DM Mono',monospace;font-size:.72rem;cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0}
.all-species-btn:hover{background:rgba(126,231,135,.14);transform:translateY(-1px)}
.pdf-export-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:1px solid var(--accent2);color:var(--accent2);background:rgba(88,166,255,.06);font-family:'DM Mono',monospace;font-size:.72rem;cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0}
.pdf-export-btn:hover{background:rgba(88,166,255,.14);transform:translateY(-1px)}
.pdf-export-btn:disabled{opacity:.5;cursor:default;transform:none}
.species-dense-wrap{animation:fadeUp .3s ease both}
.family-block{margin-bottom:22px}
.family-header{display:flex;align-items:center;gap:10px;padding:5px 12px;background:rgba(88,166,255,.07);border-left:3px solid var(--accent2);margin-bottom:8px;border-radius:0 5px 5px 0}
.family-header-name{font-family:'Playfair Display',serif;font-style:italic;font-size:.95rem;color:var(--accent2);font-weight:700}
.family-header-count{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--dim);margin-left:auto}
.genus-block-dense{margin-bottom:10px;margin-left:10px}
.genus-header-dense{display:flex;align-items:center;gap:8px;padding:2px 8px;margin-bottom:5px;border-left:2px solid var(--accent)}
.genus-header-name{font-family:'Playfair Display',serif;font-style:italic;font-size:.8rem;color:var(--accent);font-weight:600}
.genus-header-count{font-family:'DM Mono',monospace;font-size:.56rem;color:var(--dim)}
.dense-grid{display:flex;flex-wrap:wrap;gap:4px;margin-left:6px}
.dense-cell{width:18.5%;min-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:all .18s;position:relative;flex-shrink:0}
.dense-cell:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 22px rgba(0,0,0,.5);z-index:2}
.dense-cell.seen-card{border-color:rgba(126,231,135,.4)}
.dense-img-wrap{width:100%;height:150px;overflow:hidden;background:var(--surface2);position:relative}
.dense-img{width:100%;height:100%;object-fit:cover;transition:transform .35s;display:block}
.dense-cell:hover .dense-img{transform:scale(1.08)}
.dense-no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:var(--dim)}
.dense-actions{position:absolute;bottom:4px;left:4px;display:flex;gap:3px;opacity:0;transition:opacity .18s}
.dense-cell:hover .dense-actions{opacity:1}
.dense-action-btn{width:22px;height:22px;border-radius:50%;background:rgba(13,17,23,.75);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85);font-size:.68rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;line-height:1}
.dense-action-btn:hover{background:var(--accent2);color:#0d1117;border-color:var(--accent2)}
.dense-action-btn.pheno-btn:hover{background:var(--accent);border-color:var(--accent)}
.dense-seen-badge{position:absolute;top:4px;right:4px;background:var(--accent);color:#0d1117;border-radius:50%;width:16px;height:16px;font-size:.55rem;font-weight:700;display:flex;align-items:center;justify-content:center;pointer-events:none}
.dense-info{padding:4px 6px 6px}
.dense-sci{font-family:'Playfair Display',serif;font-style:italic;font-size:.82rem;color:var(--accent);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dense-com{font-size:.58rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.dense-obs{font-family:'DM Mono',monospace;font-size:.5rem;color:var(--dim);margin-top:2px}
.family-loading{text-align:center;padding:60px 20px;font-family:'DM Mono',monospace;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@media(max-width:768px){header{padding:0 12px}.header-inner{height:54px;gap:8px}.logo{font-size:1rem}.src-badge{display:none}.search-wrap{max-width:none;flex:1}.search-input,.place-input{font-size:16px}.search-dropdown{position:fixed;top:106px;left:0;right:0;border-radius:0 0 12px 12px;max-height:60vh;overflow-y:auto;z-index:500;min-width:unset}.breadcrumb{font-size:.72rem;gap:2px}.crumb{padding:2px 5px;max-width:100px;overflow:hidden;text-overflow:ellipsis}main{padding:20px 16px 80px}.level-header{margin-bottom:20px;gap:8px}.level-title{font-size:1.6rem}.card-grid{grid-template-columns:1fr 1fr;gap:10px}.kingdom-grid{gap:8px}.kingdom-card{min-width:140px}.kingdom-icon-wrap,.kingdom-img-wrap{width:56px;height:56px}.kingdom-icon-wrap{font-size:1.7rem}.kingdom-body{padding:10px 12px}.kingdom-name{font-size:.9rem}.kingdom-common,.kingdom-hint,.kingdom-arrow{display:none}.modal-overlay{padding:0;align-items:flex-end}.modal{max-width:100%;max-height:92vh;border-radius:20px 20px 0 0;border-bottom:none;transform:translateY(20px)}.modal-overlay.open .modal{transform:translateY(0)}.modal-handle{display:block}.modal-body{padding:20px 16px 32px}.modal-sci{font-size:1.4rem}.filter-bar{padding:0 12px;top:54px}.filter-inner{height:52px;gap:6px}.filter-label,.filter-divider{display:none}.place-wrap{max-width:none;flex:1;overflow:visible}.place-dropdown{position:fixed;left:0;right:0;top:106px;border-radius:0 0 12px 12px;max-height:75vh;overflow-y:auto;z-index:300}.dense-cell{width:46%}.dense-img-wrap{width:100%;height:120px}.dense-actions{opacity:1}}
@media(max-width:480px){.dense-cell{width:80px}.dense-img-wrap{width:80px;height:65px}}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo" id="logoBtn">Bio<em>Explorer</em></div>
    <nav class="breadcrumb" id="breadcrumb"></nav>
    <span class="src-badge">&#9679; iNaturalist</span>
    <button class="my-species-btn" id="mySpeciesBtn">&#128065; <span class="my-species-count" id="mySpeciesCount">0</span></button>
    <button class="auth-btn" id="authBtn"><div class="auth-avatar" id="authAvatar"></div><span id="authIcon">&#127807;</span><span id="authLabel">Conectar iNat</span></button>
  </div>
</header>
<div class="filter-bar">
  <div class="filter-inner">
    <span class="filter-label">&#128205; Zona</span>
    <div class="place-wrap" id="placeWrap">
      <span class="place-icon">&#127758;</span>
      <input class="place-input" id="placeInput" type="text" placeholder="Filtrar por zona…" autocomplete="off" spellcheck="false">
      <button class="place-clear" id="placeClear">&#10005;</button>
      <div class="place-dropdown" id="placeDropdown"></div>
    </div>
    <div class="active-place" id="activePlace">
      <span id="activePlaceName"></span>
      <button id="activePlaceClear">&#10005;</button>
    </div>
    <div class="filter-divider"></div>
    <div class="search-wrap" id="searchWrap">
      <span class="search-icon">&#128269;</span>
      <input class="search-input" id="searchInput" type="text" placeholder="Buscar taxón…" autocomplete="off" spellcheck="false">
      <button class="search-clear" id="searchClear">&#10005;</button>
      <div class="search-dropdown" id="searchDropdown"></div>
    </div>
  </div>
</div>
<main id="main"></main>
<div class="lightbox" id="lightbox"><img id="lightboxImg" src="" alt=""></div>
<div class="map-popover" id="mapPopover">
  <div class="map-popover-header" id="mapPopoverHeader"></div>
  <div id="mapPopoverBody"><div class="map-popover-loading"><div class="map-spinner"></div><span>Cargando mapa…</span></div></div>
  <div class="map-popover-footer" id="mapPopoverFooter"></div>
</div>
<div class="phenology-popover" id="phenologyPopover">
  <div class="phenology-header" id="phenologyHeader"></div>
  <div id="phenologyBody"><div class="phenology-loading"><div class="map-spinner" style="border-top-color:var(--accent)"></div><span>Cargando fenología…</span></div></div>
  <div class="phenology-footer" id="phenologyFooter"></div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalSheet">
    <div class="modal-handle"></div>
    <button class="modal-close" id="modalClose">&#10005;</button>
    <div id="modalContent"></div>
  </div>
</div>
<div id="spOverlay" style="position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .22s">
  <div style="position:sticky;top:0;z-index:10;background:rgba(13,17,23,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 40px;height:58px;display:flex;align-items:center;gap:16px">
    <div style="flex:1;min-width:0"><div style="font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:2px" id="spOverlayRank"></div><div style="font-family:'Playfair Display',serif;font-style:italic;font-size:1.1rem;font-weight:700" id="spOverlayTitle"></div></div>
    <div style="font-family:'DM Mono',monospace;font-size:.65rem;color:var(--muted);flex-shrink:0" id="spOverlayMeta"></div>
    <button class="pdf-export-btn" id="spPdfBtn">&#128196; <span class="pdf-label">PDF</span></button>
    <button id="spOverlayClose" style="width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center">&#10005;</button>
  </div>
  <div id="spOverlayBody" style="flex:1;overflow-y:auto;padding:28px 40px 60px"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const API = 'https://api.inaturalist.org/v1';

const KINGDOMS = [
  { id:'animalia', name:'Animalia', common:'Reino Animal',      icon:'🦁', taxonId:1,     hint:'explorar filos \u2192', photo:'https://inaturalist-open-data.s3.amazonaws.com/photos/225047126/medium.jpg' },
  { id:'plantae',  name:'Plantae',  common:'Reino Vegetal',     icon:'🌱', taxonId:47126, hint:'explorar filos \u2192', photo:'https://inaturalist-open-data.s3.amazonaws.com/photos/274532432/medium.jpg' },
  { id:'fungi',    name:'Fungi',    common:'Reino Fungi',       icon:'🍄', taxonId:47170, hint:'explorar filos \u2192', photo:null },
  { id:'chromista',name:'Chromista',common:'Algas y similares', icon:'🌊', taxonId:48222, hint:'explorar filos \u2192', photo:null },
  { id:'protozoa', name:'Protozoa', common:'Protozoos',         icon:'🔬', taxonId:47686, hint:'explorar filos \u2192', photo:null },
];

const RANK_ES = { kingdom:'Reino',phylum:'Filo',class:'Clase',order:'Orden',family:'Familia',genus:'G\u00e9nero',species:'Especie',subspecies:'Subespecie',stateofmatter:'Estado',subkingdom:'Subreino',superphylum:'Superfilo',subphylum:'Subfilo',superclass:'Superclase',subclass:'Subclase',superorder:'Superorden',suborder:'Suborden',superfamily:'Superfamilia',subfamily:'Subfamilia',tribe:'Tribu',subgenus:'Subg\u00e9nero' };
const RANK_ICONS = { kingdom:'🌍',phylum:'🔬',class:'📦',order:'📋',family:'🏠',genus:'🔤',species:'🌿',subspecies:'🔬' };
const NEXT_RANK = { kingdom:'phylum',phylum:'class',class:'order',order:'family',family:'genus',genus:'species' };

// NAV
const navStack = [];
function pushNav(label,fn){ navStack.push({label,renderFn:fn}); history.pushState({depth:navStack.length},'',''); repaint(); }
function goToNav(idx){ if(idx<0) navStack.length=0; else navStack.splice(idx+1); repaint(); }
function repaint(){ renderBreadcrumb(); if(!navStack.length) renderHome(); else navStack[navStack.length-1].renderFn(); }
function renderBreadcrumb(){
  const bc=document.getElementById('breadcrumb');
  if(!navStack.length){ bc.innerHTML=''; return; }
  let html='<span class="crumb" data-nav="-1">Inicio</span>';
  navStack.forEach((item,i)=>{
    html+='<span class="crumb-sep">/</span>';
    if(i<navStack.length-1) html+=`<span class="crumb" data-nav="${i}">${item.label}</span>`;
    else html+=`<span class="crumb current">${item.label}</span>`;
  });
  bc.innerHTML=html;
  bc.querySelectorAll('.crumb[data-nav]').forEach(el=>el.addEventListener('click',()=>goToNav(parseInt(el.dataset.nav))));
}
window.addEventListener('popstate',()=>{
  if(document.getElementById('modalOverlay').classList.contains('open')){ closeModal(); history.pushState({depth:navStack.length},'',''); return; }
  if(navStack.length>0){ navStack.pop(); repaint(); }
});
history.replaceState({depth:0},'','');

// API CACHE
let activePlaceId=null, activePlaceName='';
const cache={};
function clearCache(){ Object.keys(cache).forEach(k=>delete cache[k]); }

async function fetchChildren(parentId,rank){
  let all=[],page=1;
  while(true){
    const r=await fetch(`${API}/taxa?taxon_id=${parentId}&rank=${rank}&per_page=500&page=${page}&order_by=observations_count&locale=es`);
    if(!r.ok) break;
    const d=await r.json(); const res=d.results||[];
    all=all.concat(res);
    if(res.length<500||page>=10) break;
    page++; await new Promise(r=>setTimeout(r,80));
  }
  return all;
}

async function fetchSpeciesGlobal(parentId){
  const r=await fetch(`${API}/taxa?taxon_id=${parentId}&rank=species&per_page=100&order_by=observations_count&locale=es`);
  return ((await r.json()).results||[]).map(spToObj);
}

function spToObj(sp){
  return { id:sp.id,name:sp.name,common:sp.preferred_common_name||'',photo:sp.default_photo?.medium_url||sp.default_photo?.url||null,observations:sp.observations_count||0,inatUrl:`https://www.inaturalist.org/taxa/${sp.id}`,wikipedia:sp.wikipedia_url||null,ancestor_ids:sp.ancestor_ids||[] };
}

async function fetchSpeciesInPlace(parentId,placeId){
  let all=[];
  for(let page=1;page<=5;page++){
    const r=await fetch(`${API}/observations/species_counts?taxon_id=${parentId}&place_id=${placeId}&verifiable=true&captive=false&per_page=100&page=${page}&locale=es`);
    if(!r.ok) break;
    const d=await r.json(); all=all.concat(d.results||[]);
    if((d.results||[]).length<100) break;
  }
  return all.map(r=>({ id:r.taxon.id,name:r.taxon.name,common:r.taxon.preferred_common_name||'',photo:r.taxon.default_photo?.medium_url||r.taxon.default_photo?.url||null,observations:r.count||0,inatUrl:`https://www.inaturalist.org/taxa/${r.taxon.id}`,wikipedia:r.taxon.wikipedia_url||null,ancestor_ids:r.taxon.ancestor_ids||[] }));
}

async function fetchChildrenInPlace(parentId,rank,placeId){
  let all=[];
  for(let page=1;page<=5;page++){
    const r=await fetch(`${API}/observations/species_counts?taxon_id=${parentId}&place_id=${placeId}&verifiable=true&captive=false&per_page=100&page=${page}&locale=es`);
    if(!r.ok) break;
    const d=await r.json(); all=all.concat(d.results||[]);
    if((d.results||[]).length<100) break;
  }
  if(!all.length) return [];
  const ancIds=new Set(); all.forEach(r=>(r.taxon.ancestor_ids||[]).forEach(id=>ancIds.add(id)));
  const ids=[...ancIds]; const found={};
  for(let i=0;i<ids.length;i+=100){
    try{ const r=await fetch(`${API}/taxa?id=${ids.slice(i,i+100).join(',')}&per_page=100&locale=es`); const d=await r.json(); (d.results||[]).forEach(t=>{ if(t.rank===rank) found[t.id]=t; }); }catch(e){}
    if(i+100<ids.length) await new Promise(r=>setTimeout(r,100));
  }
  return Object.values(found).filter(t=>ancIds.has(t.id));
}

async function cachedChildren(parentId,rank){
  const k=`ch_${parentId}_${rank}_${activePlaceId||'g'}`;
  if(!cache[k]) cache[k]=activePlaceId?fetchChildrenInPlace(parentId,rank,activePlaceId):fetchChildren(parentId,rank);
  return cache[k];
}
async function cachedSpecies(parentId){
  const k=`sp_${parentId}_${activePlaceId||'g'}`;
  if(!cache[k]) cache[k]=activePlaceId?fetchSpeciesInPlace(parentId,activePlaceId):fetchSpeciesGlobal(parentId);
  return cache[k];
}
async function fetchPlaceCount(taxonId){
  const k=`pc_${taxonId}_${activePlaceId}`;
  if(!cache[k]) cache[k]=fetch(`${API}/observations/species_counts?taxon_id=${taxonId}&place_id=${activePlaceId}&verifiable=true&captive=false&per_page=1`).then(r=>r.ok?r.json():null).then(d=>d?.total_results??0).catch(()=>0);
  return cache[k];
}

// HOME
function renderHome(){
  const m=document.getElementById('main');
  m.innerHTML='<div class="level-header"><div><div class="level-rank">Clasificaci\u00f3n</div><div class="level-title">Reinos de la vida</div></div><div class="level-sub">Reino \u2192 Filo \u2192 Clase \u2192 Orden \u2192 Familia \u2192 G\u00e9nero \u2192 Especie</div></div><div class="kingdom-grid" id="kingdomGrid"></div>';
  const grid=document.getElementById('kingdomGrid');
  KINGDOMS.forEach(k=>{
    const card=document.createElement('div');
    card.className='kingdom-card';
    const media=document.createElement('div');
    if(k.photo){
      media.className='kingdom-img-wrap';
      const img=document.createElement('img');
      img.className='kingdom-img'; img.src=k.photo; img.alt=k.name; img.loading='lazy';
      media.appendChild(img);
    } else {
      media.className='kingdom-icon-wrap';
      media.textContent=k.icon;
    }
    const body=document.createElement('div');
    body.className='kingdom-body';
    body.innerHTML='<div class="kingdom-badge">Reino</div><div class="kingdom-name">'+k.name+'</div><div class="kingdom-common">'+k.common+'</div><div class="kingdom-hint">'+k.hint+'</div>';
    const arrow=document.createElement('div');
    arrow.className='kingdom-arrow'; arrow.textContent='\u2192';
    card.appendChild(media); card.appendChild(body); card.appendChild(arrow);
    card.addEventListener('click',()=>enterTaxon(k.taxonId,k.name,'kingdom'));
    grid.appendChild(card);
  });
}

// DRILL DOWN
async function enterTaxon(taxonId,taxonName,currentRank){
  const nextRank=NEXT_RANK[currentRank]; if(!nextRank) return;
  const nextRankEs=RANK_ES[nextRank]||nextRank;
  const renderFn=async()=>{
    showLoading(`Cargando ${nextRankEs}s de <em>${taxonName}</em>\u2026`+(activePlaceId?'<br><small style="color:var(--dim)">Filtrando por zona\u2026</small>':''));
    try{
      if(nextRank==='species'){
        const species=await cachedSpecies(taxonId);
        if(!species.length) throw new Error('No se encontraron especies'+(activePlaceId?' en esta zona.':'.'));
        await showSpecies({id:taxonId,name:taxonName,rank:currentRank},species);
      } else {
        const children=await cachedChildren(taxonId,nextRank);
        if(!children.length) throw new Error('No se encontraron '+nextRankEs+'s'+(activePlaceId?' en esta zona.':'.'));
        showChildrenLevel({id:taxonId,name:taxonName,rank:currentRank},children,nextRank);
      }
    }catch(e){ showError('Error al cargar',e.message,renderFn); }
  };
  try{
    await renderFn();
    navStack.push({label:taxonName,renderFn});
    history.pushState({depth:navStack.length},'','');
    renderBreadcrumb();
  }catch(e){ showError('Error al cargar',e.message,renderFn); }
}

async function renderCardGrid(items,rankLabel,clickFn){
  const grid=document.getElementById('grid');
  items.forEach(item=>{
    const globalCount=item.complete_species_count;
    const pillText=activePlaceId?'\u2026':(globalCount?globalCount.toLocaleString()+' spp.':'\u2014');
    const photo=item.default_photo?.medium_url||item.default_photo?.url||null;
    const card=makeCard(rankLabel,item.name,item.preferred_common_name||'',[pillText],photo);
    card.addEventListener('click',()=>clickFn(item));
    grid.appendChild(card);
  });
  if(activePlaceId){
    const cards=[...grid.querySelectorAll('.taxon-card')];
    await Promise.all(items.map(async(item,i)=>{
      const count=await fetchPlaceCount(item.id);
      const pill=cards[i]?.querySelector('.tc-pill');
      if(pill){ pill.textContent=count.toLocaleString()+' spp.'; pill.style.color='var(--accent2)'; }
    }));
  }
}

function showChildrenLevel(parent,children,childRank){
  const parentRankEs=RANK_ES[parent.rank]||parent.rank;
  const childRankEs=RANK_ES[childRank]||childRank;
  const sorted=[...children].sort((a,b)=>a.name.localeCompare(b.name));
  const m=document.getElementById('main');
  m.innerHTML=`<div class="level-header"><div><div class="level-rank">${parentRankEs}</div><div class="level-title">${parent.name}</div></div><button class="all-species-btn" id="allSpeciesBtn"><span>🌿</span><span>Ver todas las especies</span></button><div class="level-sub">${sorted.length} ${childRankEs}s</div></div><div class="card-grid" id="grid"></div>`;
  document.getElementById('allSpeciesBtn').addEventListener('click',()=>openAllSpeciesOverlay(parent.id,parent.name,parent.rank));

// ── ENRICH FAMILIES via ancestor_ids ─────────────────────────
const familyNameCache = {};
async function enrichFamilies(species){
  const needed=new Set();
  species.forEach(sp=>(sp.ancestor_ids||[]).forEach(id=>{ if(!(id in familyNameCache)) needed.add(id); }));
  const ids=[...needed];
  for(let i=0;i<ids.length;i+=100){
    try{
      const r=await fetch(`${API}/taxa?id=${ids.slice(i,i+100).join(',')}&per_page=100`);
      const d=await r.json();
      (d.results||[]).forEach(t=>{ familyNameCache[t.id]=(t.rank==='family')?t.name:null; });
    }catch(e){}
    if(i+100<ids.length) await new Promise(r=>setTimeout(r,60));
  }
  needed.forEach(id=>{ if(!(id in familyNameCache)) familyNameCache[id]=null; });
  species.forEach(sp=>{
    const ancs=sp.ancestor_ids||[];
    let fam=null;
    for(let i=ancs.length-1;i>=0;i--){ if(familyNameCache[ancs[i]]){ fam=familyNameCache[ancs[i]]; break; } }
    sp._family=fam||'Sin familia';
  });
}

// ── DENSE SPECIES GRID: familia → género ─────────────────────
async function showSpecies(parent,species){
  const parentRankEs=RANK_ES[parent.rank]||parent.rank;
  const m=document.getElementById('main');
  m.innerHTML=`<div class="level-header"><div><div class="level-rank">${parentRankEs}</div><div class="level-title">${parent.name}</div></div><div class="level-sub">${species.length} especies</div></div><div class="family-loading" id="familyLoading"><div class="spinner" style="width:30px;height:30px"></div><span>Clasificando por familia\u2026</span></div><div class="species-dense-wrap" id="denseWrap" style="display:none"></div>`;

  await enrichFamilies(species);

  const byFamily={};
  species.forEach(sp=>{
    const fam=sp._family||'Sin familia';
    const gen=sp.name.split(' ')[0];
    if(!byFamily[fam]) byFamily[fam]={};
    if(!byFamily[fam][gen]) byFamily[fam][gen]=[];
    byFamily[fam][gen].push(sp);
  });

  const families=Object.keys(byFamily).sort((a,b)=>{
    if(a==='Sin familia') return 1; if(b==='Sin familia') return -1; return a.localeCompare(b);
  });
  families.forEach(fam=>Object.keys(byFamily[fam]).forEach(gen=>byFamily[fam][gen].sort((a,b)=>a.name.localeCompare(b.name))));

  const loadEl=document.getElementById('familyLoading');
  const wrap=document.getElementById('denseWrap');
  if(loadEl) loadEl.style.display='none';
  wrap.style.display='block';

  families.forEach(fam=>{
    const genera=Object.keys(byFamily[fam]).sort();
    const totalSp=genera.reduce((s,g)=>s+byFamily[fam][g].length,0);
    const famBlock=document.createElement('div');
    famBlock.className='family-block';
    const famHdr=document.createElement('div');
    famHdr.className='family-header';
    famHdr.innerHTML='<span class="family-header-name">Familia '+fam+'</span><span class="family-header-count">'+totalSp+' sp. \u00b7 '+genera.length+' g\u00e9n.</span>';
    famBlock.appendChild(famHdr);
    genera.forEach(genus=>{
      const spp=byFamily[fam][genus];
      const genBlock=document.createElement('div');
      genBlock.className='genus-block-dense';
      const genHdr=document.createElement('div');
      genHdr.className='genus-header-dense';
      genHdr.innerHTML='<span class="genus-header-name">'+genus+'</span><span class="genus-header-count">'+spp.length+' sp.</span>';
      const grid=document.createElement('div');
      grid.className='dense-grid';
      spp.forEach(sp=>grid.appendChild(makeDenseCell(sp)));
      genBlock.appendChild(genHdr);
      genBlock.appendChild(grid);
      famBlock.appendChild(genBlock);
    });
    wrap.appendChild(famBlock);
  });
}

let popoverMap=null,popoverSpId=null;
const popover=document.getElementById('mapPopover');

const popoverBody=document.getElementById('mapPopoverBody');
const popoverFooter=document.getElementById('mapPopoverFooter');

function positionEl(el,triggerEl,w,h){
  const rect=triggerEl.getBoundingClientRect(),vw=window.innerWidth,vh=window.innerHeight;
  let left=rect.left+rect.width/2-w/2,top=rect.top-h-8;
  if(top<8) top=rect.bottom+8;
  if(left<8) left=8; if(left+w>vw-8) left=vw-w-8;
  if(top+h>vh-8) top=vh-h-8;
  el.style.left=left+'px'; el.style.top=top+'px';
}

const gbifKeyCache={};
async function getGbifKey(name){
  if(gbifKeyCache[name]!==undefined) return gbifKeyCache[name];
  try{ const r=await fetch(`https://api.gbif.org/v1/species/match?name=${encodeURIComponent(name)}&verbose=false`); const d=await r.json(); gbifKeyCache[name]=(d.matchType!=='NONE'&&d.usageKey)?d.usageKey:null; }catch(e){ gbifKeyCache[name]=null; }
  return gbifKeyCache[name];
}

async function openMapPopover(sp,triggerEl){
  if(popoverSpId===sp.id&&popover.classList.contains('visible')){ closeMapPopover(); return; }
  popoverSpId=sp.id;
  if(popover._activeTrigger) popover._activeTrigger.classList.remove('active');
  triggerEl.classList.add('active');
  if(popoverMap){ popoverMap.remove(); popoverMap=null; }
  popoverHeader.textContent=sp.name+(sp.common?' \u00b7 '+sp.common:'');
  popoverBody.innerHTML='<div class="map-popover-loading"><div class="map-spinner"></div><span>Cargando mapa\u2026</span></div>';
  popoverFooter.textContent='';
  positionEl(popover,triggerEl,300,260);
  popover.classList.add('visible'); popover._activeTrigger=triggerEl;
  const gbifKeyPromise=getGbifKey(sp.name);
  await new Promise(r=>setTimeout(r,30));
  if(popoverSpId!==sp.id) return;
  const mapEl=document.createElement('div'); mapEl.className='map-popover-map'; mapEl.id='mapPopoverMapEl';
  popoverBody.innerHTML=''; popoverBody.appendChild(mapEl);
  popoverMap=L.map('mapPopoverMapEl',{zoom:2,center:[20,0],zoomControl:false,attributionControl:false});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19}).addTo(popoverMap);
  L.tileLayer('https://api.inaturalist.org/v1/points/{z}/{x}/{y}.png?taxon_id='+sp.id+'&color=%232d9e45&quality_grade=research&captive=false',{maxZoom:19,opacity:0.85}).addTo(popoverMap);
  gbifKeyPromise.then(gbifKey=>{
    if(!gbifKey||!popoverMap) return;
    L.tileLayer('https://api.gbif.org/v2/map/occurrence/density/{z}/{x}/{y}@1x.png?taxonKey='+gbifKey+'&style=classic.point',{maxZoom:19,opacity:0.5}).addTo(popoverMap);
    popoverFooter.textContent='iNaturalist + GBIF';
  });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,opacity:0.8}).addTo(popoverMap);
  popoverFooter.textContent='iNaturalist \u00b7 todas las observaciones';
  setTimeout(()=>popoverMap?.invalidateSize(),30);
  // Center on actual observations
  const placeParam = activePlaceId ? '&place_id='+activePlaceId : '';
  fetch(API+'/observations?taxon_id='+sp.id+'&quality_grade=research&captive=false&per_page=50&order_by=votes'+placeParam)
  .then(r=>r.json()).then(d=>{
    const obs=(d.results||[]).filter(o=>o.location);
    if(!obs.length||!popoverMap) return;
    const latlngs=obs.map(o=>{ const p=o.location.split(','); return [parseFloat(p[0]),parseFloat(p[1])]; }).filter(p=>!isNaN(p[0])&&!isNaN(p[1]));
    if(!latlngs.length) return;
    try{ popoverMap.fitBounds(L.latLngBounds(latlngs).pad(0.15),{maxZoom:6}); }catch(e){}
  }).catch(()=>{});
}
function closeMapPopover(){
  popover.classList.remove('visible'); popoverSpId=null;
  if(popover._activeTrigger){ popover._activeTrigger.classList.remove('active'); popover._activeTrigger=null; }
  setTimeout(()=>{ if(popoverMap&&!popover.classList.contains('visible')){ popoverMap.remove(); popoverMap=null; } },220);
}

// PHENOLOGY POPOVER
const phenologyPopover=document.getElementById('phenologyPopover');
const phenologyHeader=document.getElementById('phenologyHeader');
const phenologyBody=document.getElementById('phenologyBody');
const phenologyFooter=document.getElementById('phenologyFooter');
let phenologySpId=null;
const phenologyCache={};
const MONTHS=['E','F','M','A','M','J','J','A','S','O','N','D'];
const MONTH_FULL=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

async function fetchPhenologyData(sp){
  const placeKey=activePlaceId||'g';
  const cacheKey=sp.id+'_'+placeKey;
  if(phenologyCache[cacheKey]) return phenologyCache[cacheKey];
  let inatUrl=API+'/observations/histogram?taxon_id='+sp.id+'&quality_grade=research&captive=false&date_field=observed&interval=month_of_year';
  if(activePlaceId) inatUrl+='&place_id='+activePlaceId;
  const inatP=fetch(inatUrl).then(r=>r.ok?r.json():null).then(d=>{const raw=d?.results?.month_of_year||{};return Array.from({length:12},(_,i)=>raw[i+1]||0);}).catch(()=>Array(12).fill(0));
  const gbifP=activePlaceId?Promise.resolve(Array(12).fill(0)):getGbifKey(sp.name).then(key=>{
    if(!key) return Array(12).fill(0);
    return fetch('https://api.gbif.org/v1/occurrence/search?taxonKey='+key+'&basisOfRecord=HUMAN_OBSERVATION&facet=month&facetLimit=12&limit=0').then(r=>r.ok?r.json():null).then(d=>{const arr=Array(12).fill(0);(d?.facets?.[0]?.counts||[]).forEach(c=>{const m=parseInt(c.name)-1;if(m>=0&&m<12)arr[m]=c.count;});return arr;}).catch(()=>Array(12).fill(0));
  });
  const promise=Promise.all([inatP,gbifP]).then(([inat,gbif])=>{
    const inatPeak=Math.max(...inat,1),gbifPeak=Math.max(...gbif,1);
    const scale=gbifPeak>0?inatPeak/gbifPeak:1;
    const merged=inat.map((v,i)=>v+gbif[i]*scale);
    return {inat,gbif,merged,hasGbif:!activePlaceId&&gbifPeak>0};
  });
  phenologyCache[cacheKey]=promise;
  return promise;
}

function renderPhenologyChart(data){
  const{inat,gbif,merged,hasGbif}=data;
  const mergedMax=Math.max(...merged,1);
  phenologyBody.innerHTML='<div class="phenology-body"><div class="phenology-chart" id="phenoChart"></div></div>';
  const chart=document.getElementById('phenoChart');
  MONTHS.forEach((m,i)=>{
    const h=Math.round((merged[i]/mergedMax)*62);
    const inatH=hasGbif?Math.round(h*(inat[i]/Math.max(inat[i]+gbif[i],1))):h;
    const gbifH=h-inatH;
    const tip=hasGbif?'iNat: '+inat[i].toLocaleString()+' \u00b7 GBIF: '+gbif[i].toLocaleString():'iNat: '+inat[i].toLocaleString();
    const wrap=document.createElement('div'); wrap.className='phenology-bar-wrap'; wrap.title=MONTH_FULL[i]+' \u2014 '+tip;
    let bars='';
    if(hasGbif&&gbifH>0) bars+='<div style="width:100%;height:'+gbifH+'px;background:#e36d1e;opacity:.85;border-radius:'+(inatH>0?'0':'3px 3px')+' 0 0"></div>';
    if(inatH>0) bars+='<div style="width:100%;height:'+inatH+'px;background:#2d9e45;opacity:.9;border-radius:'+(!hasGbif||gbifH===0?'3px 3px':'0 0')+' 0 0"></div>';
    if(h===0) bars+='<div style="width:100%;height:2px;background:var(--border);border-radius:1px"></div>';
    wrap.innerHTML='<div style="display:flex;flex-direction:column;justify-content:flex-end;height:62px;width:100%">'+bars+'</div><div class="phenology-month">'+m+'</div>';
    chart.appendChild(wrap);
  });
  const regionTag=activePlaceId?'<span style="color:var(--accent2)">\ud83d\udccd '+activePlaceName+'</span>':'<span>\ud83c\udf0d Global</span>';
  phenologyFooter.innerHTML='<div class="phenology-legend"><div class="phenology-dot" style="background:#2d9e45"></div> iNat</div>'+(hasGbif?'<div class="phenology-legend"><div class="phenology-dot" style="background:#e36d1e"></div> GBIF</div>':'')+'<div style="margin-left:auto">'+regionTag+'</div>';
}

async function openPhenologyPopover(sp,triggerEl){
  if(phenologySpId===sp.id&&phenologyPopover.classList.contains('visible')){ closePhenologyPopover(); return; }
  closeMapPopover();
  phenologySpId=sp.id;
  if(phenologyPopover._activeTrigger) phenologyPopover._activeTrigger.classList.remove('active');
  triggerEl.classList.add('active');
  phenologyHeader.textContent=sp.name+(sp.common?' \u00b7 '+sp.common:'');
  phenologyBody.innerHTML='<div class="phenology-loading"><div class="map-spinner" style="border-top-color:var(--accent)"></div><span>Cargando fenolog\u00eda\u2026</span></div>';
  phenologyFooter.innerHTML='';
  positionEl(phenologyPopover,triggerEl,320,200);
  phenologyPopover.classList.add('visible'); phenologyPopover._activeTrigger=triggerEl;
  const data=await fetchPhenologyData(sp);
  if(phenologySpId!==sp.id) return;
  renderPhenologyChart(data);
}
function closePhenologyPopover(){
  phenologyPopover.classList.remove('visible'); phenologySpId=null;
  if(phenologyPopover._activeTrigger){ phenologyPopover._activeTrigger.classList.remove('active'); phenologyPopover._activeTrigger=null; }
}

async function loadGallery(sp){
  try{
    const res=await fetch(API+'/observations?taxon_id='+sp.id+'&quality_grade=research&photos=true&per_page=24&order_by=votes&locale=es');
    const data=await res.json(); const obs=data.results||[];
    const seen=new Set(); galleryPhotos=[];
    if(sp.photo){ const large=sp.photo.replace('medium','large'); seen.add(large); galleryPhotos.push({url:large,thumb:sp.photo,attr:''}); }
    obs.forEach(o=>(o.photos||[]).forEach(p=>{
      const large=(p.url||'').replace('square','large').replace('medium','large');
      const thumb=(p.url||'').replace('square','small').replace('medium','small');
      if(large&&!seen.has(large)){ seen.add(large); galleryPhotos.push({url:large,thumb,attr:p.attribution||''}); }
    }));
    galleryIndex=0; renderGallery();
  }catch(e){ galleryPhotos=sp.photo?[{url:sp.photo.replace('medium','large'),thumb:sp.photo,attr:''}]:[]; galleryIndex=0; renderGallery(); }
}

function renderGallery(){
  const wrap=document.getElementById('galleryWrap'); if(!wrap) return;
  if(!galleryPhotos.length){ wrap.innerHTML='<div style="width:100%;aspect-ratio:16/9;background:var(--surface2);border-radius:16px 16px 0 0;display:flex;align-items:center;justify-content:center;font-size:4rem">\ud83d\udcf7</div>'; return; }
  const p=galleryPhotos[galleryIndex],total=galleryPhotos.length;
  wrap.innerHTML='<img class="gallery-main" id="galleryMain" src="'+p.url+'" alt="">'+(total>1?'<div class="gallery-counter">'+(galleryIndex+1)+' / '+total+'</div>':'')+(galleryIndex>0?'<button class="gallery-nav prev" id="galleryPrev">\u2039</button>':'')+(galleryIndex<total-1?'<button class="gallery-nav next" id="galleryNext">\u203a</button>':'')+(p.attr?'<div class="gallery-caption">'+p.attr+'</div>':'')+(total>1?'<div class="gallery-thumbs" id="galleryThumbs">'+galleryPhotos.map((ph,i)=>'<img class="gallery-thumb '+(i===galleryIndex?'active':'')+'" src="'+ph.thumb+'" data-i="'+i+'" alt="">').join('')+'</div>':'');
  document.getElementById('galleryMain')?.addEventListener('click',()=>{ document.getElementById('lightboxImg').src=p.url; document.getElementById('lightbox').classList.add('open'); });
  document.getElementById('galleryPrev')?.addEventListener('click',()=>{ galleryIndex--; renderGallery(); });
  document.getElementById('galleryNext')?.addEventListener('click',()=>{ galleryIndex++; renderGallery(); });
  document.getElementById('galleryThumbs')?.querySelectorAll('.gallery-thumb').forEach(el=>el.addEventListener('click',()=>{ galleryIndex=+el.dataset.i; renderGallery(); }));
}

function showInatLoginPrompt(){
  const m=document.createElement('div');
  m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:2000;display:flex;align-items:center;justify-content:center;padding:24px';
  m.innerHTML='<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;max-width:360px;width:100%;text-align:center"><div style="font-size:2.5rem;margin-bottom:12px">\ud83c\udf3f</div><div style="font-family:\'Playfair Display\',serif;font-style:italic;font-size:1.3rem;margin-bottom:8px">Conectar con iNaturalist</div><div style="color:var(--muted);font-size:.8rem;margin-bottom:20px;font-family:\'DM Mono\',monospace;line-height:1.5">Introduce tu usuario para sincronizar tus observaciones</div><input id="inatLoginInput" type="text" placeholder="tu_usuario_inat" autocomplete="off" style="width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:\'DM Mono\',monospace;font-size:16px;outline:none;margin-bottom:12px;text-align:center"><button id="inatLoginBtn" style="width:100%;padding:12px;background:var(--accent);color:#0d1117;border:none;border-radius:8px;font-size:.9rem;cursor:pointer;font-family:\'DM Mono\',monospace;font-weight:600;margin-bottom:8px">Sincronizar</button><div id="inatLoginStatus" style="font-family:\'DM Mono\',monospace;font-size:.72rem;color:var(--muted);min-height:18px;line-height:1.5"></div><button id="inatLoginClose" style="margin-top:10px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:.82rem">Cancelar</button></div>';
  const input=m.querySelector('#inatLoginInput'),btn=m.querySelector('#inatLoginBtn'),status=m.querySelector('#inatLoginStatus');
  const doSync=async()=>{ const login=input.value.trim(); if(!login) return; btn.disabled=true; btn.textContent='\u2026'; status.style.color='var(--muted)'; status.textContent='Verificando usuario\u2026'; try{ await syncInatUser(login,status); saveLocal(); updateAuthUI(); updateSeenCounter(); status.style.color='var(--accent)'; setTimeout(()=>document.body.removeChild(m),1000); }catch(e){ status.style.color='var(--accent3)'; status.textContent='\u2717 '+e.message; btn.disabled=false; btn.textContent='Sincronizar'; } };
  btn.addEventListener('click',doSync);
  input.addEventListener('keydown',e=>{ if(e.key==='Enter') doSync(); });

async function syncInatUser(login,statusEl){
  const userRes=await fetch(API+'/users/autocomplete?q='+encodeURIComponent(login)+'&per_page=5');
  if(!userRes.ok) throw new Error('Error al contactar iNaturalist');
  const userData=await userRes.json();
  const user=(userData.results||[]).find(u=>u.login.toLowerCase()===login.toLowerCase());
  if(!user) throw new Error('Usuario "'+login+'" no encontrado');
  if(statusEl) statusEl.textContent='\u2713 @'+user.login+' encontrado. Descargando\u2026';
  currentUser={login:user.login,name:user.name||user.login,icon:user.icon||null};
  const PER_PAGE=200; const newSeen={}; let page=1,total=null;
  while(true){
    const res=await fetch(API+'/observations/species_counts?user_login='+encodeURIComponent(user.login)+'&per_page='+PER_PAGE+'&page='+page+'&locale=es');
    if(!res.ok) break;
    const data=await res.json();
    if(total===null) total=data.total_results||0;
    const results=data.results||[];
    if(!results.length) break;
    results.forEach(r=>{ const t=r.taxon; newSeen[t.id]={id:t.id,name:t.name,common:t.preferred_common_name||'',photo:t.default_photo?.medium_url||null,inatUrl:'https://www.inaturalist.org/taxa/'+t.id,ancestor_ids:t.ancestor_ids||[],count:r.count}; });
    if(statusEl) statusEl.textContent='Cargando\u2026 '+Object.keys(newSeen).length+(total?' / '+total:'')+' especies';
    if(total!==null&&Object.keys(newSeen).length>=total) break;
    if(results.length<PER_PAGE) break;
    page++; await new Promise(r=>setTimeout(r,100));
  }
  seenCache=newSeen;
  if(statusEl) statusEl.textContent='\u2713 '+Object.keys(seenCache).length+' especies sincronizadas';
}

  s.textContent='.sp-overlay-open{opacity:1!important;pointer-events:all!important}.sp-load-more-wrap{text-align:center;padding:24px 0 8px}.sp-load-more-btn{padding:10px 28px;border-radius:8px;border:1px solid var(--accent);color:var(--accent);background:rgba(126,231,135,.06);font-family:\'DM Mono\',monospace;font-size:.78rem;cursor:pointer;transition:all .2s}.sp-load-more-btn:hover{background:rgba(126,231,135,.14)}.sp-load-more-btn:disabled{opacity:.5;cursor:default}.sp-load-done{text-align:center;padding:20px 0;font-family:\'DM Mono\',monospace;font-size:.7rem;color:var(--dim)}.sp-overlay-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px;gap:14px;font-family:\'DM Mono\',monospace;font-size:.82rem;color:var(--muted)}.sp-overlay-grid .dense-cell{width:160px}.sp-overlay-grid .dense-img-wrap{width:160px;height:130px}.sp-overlay-grid .dense-sci{font-size:.72rem}.sp-overlay-grid .dense-com{font-size:.65rem}.sp-overlay-grid .dense-info{padding:6px 8px 8px}.sp-overlay-grid .dense-actions{opacity:1}@media(max-width:768px){.sp-overlay-grid .dense-cell{width:130px}.sp-overlay-grid .dense-img-wrap{width:130px;height:106px}}';

function openAllSpeciesOverlay(taxonId,taxonName,taxonRank){
  spState={taxonId,taxonName,taxonRank,page:1,total:null,loaded:[],done:false,loading:false};
  spOverlay.style.opacity='1'; spOverlay.style.pointerEvents='all';
  document.body.style.overflow='hidden';
  spOverlayTitle.textContent=taxonName;
  spOverlayRank.textContent=RANK_ES[taxonRank]||taxonRank;
  spOverlayMeta.textContent=activePlaceName?'\ud83d\udccd '+activePlaceName:'';
  spOverlayBody.innerHTML='<div class="sp-overlay-loading"><div class="spinner"></div><div>Cargando\u2026</div></div>';
  spLoadNextPage();
}
function closeAllSpeciesOverlay(){ spState.loading=false; spOverlay.style.opacity='0'; spOverlay.style.pointerEvents='none'; document.body.style.overflow=''; }
document.getElementById('spOverlayClose').addEventListener('click',closeAllSpeciesOverlay);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&spOverlay.style.opacity==='1') closeAllSpeciesOverlay(); });

async function spLoadNextPage(){
  if(spState.loading||spState.done) return; spState.loading=true;
  let results=[];
  try{
    const base=activePlaceId?'taxon_id='+spState.taxonId+'&place_id='+activePlaceId+'&verifiable=true&captive=false':'taxon_id='+spState.taxonId+'&verifiable=true&captive=false';
    const r=await fetch(API+'/observations/species_counts?'+base+'&per_page=200&page='+spState.page+'&locale=es');
    const d=await r.json();
    if(spState.page===1) spState.total=d.total_results||null;
    results=(d.results||[]).map(row=>({id:row.taxon.id,name:row.taxon.name,common:row.taxon.preferred_common_name||'',photo:row.taxon.default_photo?.medium_url||null,observations:row.count||0,inatUrl:'https://www.inaturalist.org/taxa/'+row.taxon.id,wikipedia:null,ancestor_ids:row.taxon.ancestor_ids||[]}));
  }catch(e){ spState.loading=false; spOverlayBody.innerHTML='<div class="sp-overlay-loading" style="color:var(--accent3)">Error.</div>'; return; }
  if(spOverlay.style.opacity!=='1') return;
  spState.loaded=spState.loaded.concat(results);
  spState.done=results.length===0||(spState.total!==null&&spState.loaded.length>=spState.total);
  spState.page++; spState.loading=false;
  await spRenderAll();
}

async function spRenderAll(){
  const totalLoaded=spState.loaded.length;
  spOverlayMeta.textContent=totalLoaded.toLocaleString()+(spState.total?' de '+spState.total.toLocaleString():'')+' especies'+(activePlaceName?' \u00b7 \ud83d\udccd '+activePlaceName:'');
  if(!totalLoaded){ spOverlayBody.innerHTML='<div class="sp-overlay-loading" style="color:var(--muted)">No se encontraron especies</div>'; return; }
  await enrichFamilies(spState.loaded);
  const byFamily={};
  spState.loaded.forEach(sp=>{ const fam=sp._family||'Sin familia'; const gen=sp.name.split(' ')[0]; if(!byFamily[fam]) byFamily[fam]={}; if(!byFamily[fam][gen]) byFamily[fam][gen]=[]; byFamily[fam][gen].push(sp); });
  const families=Object.keys(byFamily).sort((a,b)=>{ if(a==='Sin familia') return 1; if(b==='Sin familia') return -1; return a.localeCompare(b); });
  families.forEach(fam=>Object.keys(byFamily[fam]).forEach(gen=>byFamily[fam][gen].sort((a,b)=>a.name.localeCompare(b.name))));
  const wrap=document.createElement('div'); wrap.className='species-dense-wrap sp-overlay-grid';
  families.forEach(fam=>{
    const genera=Object.keys(byFamily[fam]).sort();
    const totalSp=genera.reduce((s,g)=>s+byFamily[fam][g].length,0);
    const famBlock=document.createElement('div'); famBlock.className='family-block';
    const famHdr=document.createElement('div'); famHdr.className='family-header';
    famHdr.innerHTML='<span class="family-header-name">Familia '+fam+'</span><span class="family-header-count">'+totalSp+' sp. \u00b7 '+genera.length+' g\u00e9n.</span>';
    famBlock.appendChild(famHdr);
    genera.forEach(genus=>{
      const spp=byFamily[fam][genus];
      const genBlock=document.createElement('div'); genBlock.className='genus-block-dense';
      const genHdr=document.createElement('div'); genHdr.className='genus-header-dense';
      genHdr.innerHTML='<span class="genus-header-name">'+genus+'</span><span class="genus-header-count">'+spp.length+' sp.</span>';
      const grid=document.createElement('div'); grid.className='dense-grid';
      spp.forEach(sp=>grid.appendChild(makeDenseCell(sp)));
      genBlock.appendChild(genHdr); genBlock.appendChild(grid);
      famBlock.appendChild(genBlock);
    });
    wrap.appendChild(famBlock);
  });
  spOverlayBody.innerHTML=''; spOverlayBody.appendChild(wrap);
  if(!spState.done){ const d=document.createElement('div'); d.className='sp-load-more-wrap'; d.innerHTML='<button class="sp-load-more-btn" id="spLoadMoreBtn">Cargar m\u00e1s</button>'; spOverlayBody.appendChild(d); document.getElementById('spLoadMoreBtn').addEventListener('click',()=>{ document.getElementById('spLoadMoreBtn').disabled=true; spLoadNextPage(); }); }
  else { const d=document.createElement('div'); d.className='sp-load-done'; d.textContent='\u2713 '+totalLoaded.toLocaleString()+' especies'; spOverlayBody.appendChild(d); }
}

// PDF
document.getElementById('spPdfBtn').addEventListener('click',async()=>{
  const btn=document.getElementById('spPdfBtn'); if(btn.disabled) return;
  btn.disabled=true; btn.textContent='\u23f3';
  try{
    const allSpecies=spState.loaded||[];
    if(!allSpecies.length){ alert('No hay especies cargadas.'); return; }
    openPrintPage(allSpecies,spState.taxonName||'Tax\u00f3n',activePlaceName||'');
  }catch(e){ alert('Error: '+e.message); }
  finally{ btn.disabled=false; btn.innerHTML='\ud83d\udcc4 <span class="pdf-label">PDF</span>'; }
});

async function openPrintPage(species,taxonName,regionName){
  await enrichFamilies(species);
  const byFamily={};
  species.forEach(sp=>{ const fam=sp._family||'Sin familia'; const gen=sp.name.split(' ')[0]; if(!byFamily[fam]) byFamily[fam]={}; if(!byFamily[fam][gen]) byFamily[fam][gen]=[]; byFamily[fam][gen].push(sp); });
  const families=Object.keys(byFamily).sort((a,b)=>{ if(a==='Sin familia') return 1; if(b==='Sin familia') return -1; return a.localeCompare(b); });
  families.forEach(fam=>Object.keys(byFamily[fam]).forEach(gen=>byFamily[fam][gen].sort((a,b)=>a.name.localeCompare(b.name))));
  const fmtObs=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1000?Math.round(n/1000)+'k':String(n||0);
  const sorted=[...species].sort((a,b)=>a.name.localeCompare(b.name));
  const familySections=families.map(fam=>{
    const genera=Object.keys(byFamily[fam]).sort();
    const totalSp=genera.reduce((s,g)=>s+byFamily[fam][g].length,0);
    const genusBlocks=genera.map(genus=>{
      const spp=byFamily[fam][genus];
      const cols=Math.min(spp.length,4);
      const cells=spp.map(sp=>{
        const img=sp.photo?'<img src="'+sp.photo.replace('/square.','/medium.').replace('/small.','/medium.')+'" loading="eager">':'<div class="no-img">\ud83d\udcf7</div>';
        return '<div class="sp-cell"><div class="sp-img-wrap">'+img+'</div><div class="sp-txt"><div class="sp-sci">'+sp.name+'</div>'+(sp.common?'<div class="sp-com">'+sp.common+'</div>':'')+'<div class="sp-obs">'+fmtObs(sp.observations)+' obs.</div></div></div>';
      }).join('');
      return '<div class="genus-block"><div class="genus-banner"><span class="genus-name">'+genus+'</span><span class="genus-count">'+spp.length+' sp.</span></div><div class="sp-grid" style="grid-template-columns:repeat('+cols+',32mm)">'+cells+'</div></div>';
    }).join('');
    return '<div class="family-section"><div class="family-banner"><span class="family-name">'+fam+'</span><span class="family-count">'+totalSp+' sp. \u00b7 '+genera.length+' g\u00e9n.</span></div><div class="genera-wrap">'+genusBlocks+'</div></div>';
  }).join('');

  const html='<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>'+taxonName+'</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#0d1117;font-family:Arial,sans-serif;color:#e6edf3;padding:8mm;width:210mm;margin:0;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}.page-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:4px;margin-bottom:10px;border-bottom:1px solid #30363d}.page-header .title{font-family:Georgia,serif;font-style:italic;font-size:11pt;color:#e6edf3}.page-header .meta{font-family:monospace;font-size:6.5pt;color:#484f58}.family-section{width:100%;margin-bottom:8px}.family-banner{display:flex;align-items:baseline;gap:8px;background:#161b22;border-left:4px solid #58a6ff;padding:4px 8px;margin-bottom:4px}.family-name{font-family:Georgia,serif;font-style:italic;font-size:9pt;color:#58a6ff;font-weight:bold}.family-count{font-family:monospace;font-size:6pt;color:#484f58}.genera-wrap{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-start}.genus-block{display:inline-flex;flex-direction:column;gap:0;break-inside:avoid}.genus-banner{display:flex;align-items:center;gap:5px;background:#161b22;border-top:2px solid #7ee787;padding:3px 5px 3px 6px;width:100%}.genus-name{font-family:Georgia,serif;font-style:italic;font-size:7pt;color:#7ee787;font-weight:bold;white-space:nowrap}.genus-count{font-family:monospace;font-size:5.5pt;color:#484f58}.sp-grid{display:grid;gap:1px;background:#0d1117}.sp-cell{background:#0d1117;overflow:hidden;width:32mm}.sp-img-wrap{width:32mm;height:32mm;overflow:hidden;background:#161b22}.sp-img-wrap img{width:100%;height:100%;object-fit:cover;display:block}.no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#30363d;font-size:16pt}.sp-txt{background:#0d1117;padding:2px 3px 3px}.sp-sci{font-family:Georgia,serif;font-style:italic;font-size:5.2pt;color:#7ee787;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sp-com{font-size:4.8pt;color:#8b949e;line-height:1.3;margin-top:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sp-obs{font-family:monospace;font-size:4.2pt;color:#30363d;margin-top:1px}@media print{@page{margin:8mm;size:A4 portrait}html,body{background:#0d1117!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}.genus-block{break-inside:avoid}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}}</style></head><body><div style="position:fixed;inset:0;background:#0d1117;z-index:-1;-webkit-print-color-adjust:exact;print-color-adjust:exact"></div><div class="page-header"><span class="title">'+taxonName+(regionName?' \u00b7 '+regionName:'')+'</span><span class="meta">'+sorted.length+' especies \u00b7 BioExplorer</span></div>'+familySections+'<scr'+'ipt>const imgs=Array.from(document.querySelectorAll("img"));let pending=imgs.filter(i=>!i.complete||!i.naturalWidth).length;const tryPrint=()=>{pending--;if(pending<=0)doPrint();};const doPrint=()=>{window.focus();window.print();};if(pending===0){setTimeout(doPrint,300);}else{imgs.forEach(img=>{if(!img.complete||!img.naturalWidth){img.onload=tryPrint;img.onerror=tryPrint;}});setTimeout(doPrint,8000);}<\/scr'+'ipt></body></html>';

  const win=window.open('','_blank');
  if(!win){ alert('Permite las ventanas emergentes para generar el PDF.'); return; }
  win.document.write(html); win.document.close();
}
